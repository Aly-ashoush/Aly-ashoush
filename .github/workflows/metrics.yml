name: GitHub Metrics

on:
  schedule:
    - cron: "0 * * * *"  # كل ساعة
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    
    # 🔑 إضافة قسم الأذونات
    permissions:
      contents: write  # للكتابة على المستودع
      pull-requests: read
      issues: read
      
    steps:
      - uses: actions/checkout@v4  # الترقية إلى الإصدار 4
        
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Aly-ashoush
          config_timezone: Africa/Cairo

          # 📊 الأقسام الرئيسية
          base: header, repositories
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_followup: yes
          plugin_notable: yes

          # ⏱️ إعدادات WakaTime
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}

          # 👨‍💻 إعدادات LeetCode
          plugin_leetcode: yes
          plugin_leetcode_user: aly_ashoush
          
          # 🛠️ إعدادات إضافية لتجنب الأخطاء
          plugin_lines_limit: 10  # تحديد الحد الأقصى للمستودعات
          plugin_languages_threshold: 0%  # عرض جميع اللغات
          plugin_languages_ignored: html,css  # تجاهل لغات معينة
