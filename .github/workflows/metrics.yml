name: GitHub Metrics

on:
  schedule: [{cron: "0 * * * *"}]  # كل ساعة
  push: {branches: ["main"]}
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Aly-ashoush
          config_timezone: Africa/Cairo

          # 💡 Main sections
          base: header, repositories
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_followup: yes
          plugin_notable: yes

          # ⏱️ WakaTime settings
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}

          # 👨‍💻 LeetCode Plugin
          plugin_leetcode: yes
          plugin_leetcode_user: aly_ashoush
